<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Crash Flight Prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div class="hud">
        <div class="top-row">
          <div class="mode-switch" id="mode-switch"></div>
          <button id="more-button" class="chip lobby-chip" aria-label="Lobby">
            <svg
              class="lobby-icon"
              width="28"
              height="28"
              viewBox="0 0 28 28"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M13.6 7.8c.8-2.8 3-4.6 5.9-4.6h2.7" />
                <path d="M13.6 7.8c-2.3 2.6-5 3.6-7.8 3.4" />
                <path d="M15.4 13.6c1.6-2.5 4-4.3 7.2-5" />
              </g>
              <circle cx="9" cy="19" r="5" fill="currentColor" />
              <circle cx="19.5" cy="20.5" r="4.5" fill="currentColor" opacity="0.8" />
              <path
                d="M11.2 13.8c-.2-.9-.9-1.4-1.8-1.4-.9 0-1.5.5-1.8 1.3"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                fill="none"
              />
            </svg>
          </button>
        </div>
        <div class="multiplier-strip" id="multiplier-container">
          <strong id="current-multiplier">×1.00</strong>
        </div>

        <div id="debug-menu" class="debug-menu hidden">
          <div class="debug-content">
            <div class="debug-header">
              <h3>Developer Tools</h3>
              <button id="close-debug" class="chip ghost chip-icon">X</button>
            </div>
            <div class="debug-grid">
              <label class="debug-field">
                <span>Crash Order</span>
                <select id="crash-select"></select>
              </label>
              <label class="debug-field">
                <span>Trainer Mode</span>
                <input type="checkbox" id="trainer-toggle" />
              </label>
              <div class="debug-field">
                <span>Status</span>
                <strong id="status-label">Idle</strong>
              </div>
              <div class="debug-field">
                <span>Multiplier</span>
                <strong id="multiplier-label">×1.00</strong>
              </div>
            </div>
            <button id="copy-script-button" class="ghost hidden">
              Copy Trainer Script
            </button>
          </div>
        </div>

        <div class="center-overlay hidden" id="win-overlay">
          <div class="win-pulse">
            <span>You win</span>
            <strong id="win-amount">$0.00</strong>
          </div>
        </div>

        <div class="primary-action-area">
          <div class="bet-spinner" id="bet-spinner">
            <button class="spinner-btn" id="bet-minus">−</button>
            <div class="bet-display">
              <span class="label">Bet</span>
              <strong id="bet-amount">$10.00</strong>
            </div>
            <button class="spinner-btn" id="bet-plus">+</button>
          </div>
          <button id="primary-button" class="cta ready">
            <span class="cta-label">Bet</span>
            <small id="cta-subtext">$10.00</small>
          </button>
        </div>

        <footer class="bottom-bar">
          <div class="meta">
            <span id="meta-left-label">Total bet:</span>
            <strong id="meta-left-value">$10.00</strong>
          </div>
          <div class="meta">
            <span>Balance:</span>
            <strong id="balance-display">$1,000.00</strong>
          </div>
        </footer>
      </div>
    </div>
    <div
      id="games-modal"
      class="games-modal hidden"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
    >
      <div id="games-overlay" class="games-modal__overlay"></div>
      <div class="games-modal__content">
        <header class="games-modal__header">
          <h2>More Games</h2>
          <button id="games-close-button" class="chip ghost chip-icon">X</button>
        </header>
        <div id="games-list" class="games-list"></div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
